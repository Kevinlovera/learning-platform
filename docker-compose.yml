services:

  curso-service:
    image: learning-platform-curso-service:1.0
    container_name: curso-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - learning-network

  inscripcion-service:
    image: learning-platform-inscripcion-service:1.0
    container_name: inscripcion-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CURSO_SERVICE_URL: http://curso-service:8081
    depends_on:
      - curso-service
    networks:
      - learning-network

networks:
  learning-network:
    driver: bridge