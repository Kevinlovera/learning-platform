spring.application.name=inscripcion-service

server.port=8082

# ===============================
# ORACLE DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/xepdb1}
spring.datasource.username=${DB_USERNAME:LEARNING1}
spring.datasource.password=${DB_PASSWORD:1234567}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CURSO SERVICE
# ===============================

curso-service.url=${CURSO_SERVICE_URL:http://localhost:8081}