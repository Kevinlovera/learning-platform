name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Curso Service
        uses: docker/build-push-action@v6
        with:
          context: ./curso-service/curso-service
          push: true
          tags: |
            kevinjesuslr/learning-platform-curso-service:latest
            kevinjesuslr/learning-platform-curso-service:${{ github.sha }}

      - name: Build and Push Inscripcion Service
        uses: docker/build-push-action@v6
        with:
          context: ./inscripcion-sevice/inscripcion-sevice
          push: true
          tags: |
            kevinjesuslr/learning-platform-inscripcion-service:latest
            kevinjesuslr/learning-platform-inscripcion-service:${{ github.sha }}